# daughter_watch 板端服务配置示例
# 用法: ./daughter_watch config.ini
# '#' 或 ';' 起始为注释

[rtsp]
# 摄像头低清子码流地址 (板子原生RTSP直连, 无ffmpeg依赖)
url = rtsp://admin:pass@192.168.1.64:554/Streaming/Channels/102
# 可选: 绑定源 IP。摄像头固件对"历史高频重连的客户端"有持久配额,
# 换一个源 IP (板端 ip addr add 别名) 让它认为是新客户端。
# 留空 = 用默认路由源地址。
bind_ip =
# MPP 硬解缓冲区分辨率上限 (设成和子码流原生一致即可)
width = 640
height = 360
# 摄像头源帧率仅用于文档；融合管线独立使用 person_scan_fps。
fps = 5
# RV1106 没有 VDEC 硬件块。开启后只把 SPS/PPS/IDR 关键帧送入软件解码器,
# 并按 1s 节流抽样中间帧, 有效分析帧率约 1 FPS (而非 GOP 间隔 0.5 FPS),
# CPU 约 10-20% (全帧软件解码会打满 90%+)。
# 185MB 单核板务必保持 true。
keyframes_only = true

[high]
# 4K 主码流接入有两种模式, 二选一:
#   pipe 模式 (推荐, 生产在用): run.sh 用 ffmpeg 拉流写 FIFO, 本服务只读不拉流。
#     设置 pipe_path 即启用; url 被忽略。
#   rtsp 模式: 本服务直接拉流, 留空 pipe_path 即可。
pipe_path =
# 音频 FIFO 路径 (pipe 模式): 由 run.sh 的第二路 ffmpeg 输出 ADTS 流。
# 留空 = 该模式不带音频。
audio_pipe_path =
# 4K 主码流: 板端纯透传拉取, 不解码, 只进内存环形缓冲。
# 留空 = 关闭高码流链路 (板端不保存视频)。
url = rtsp://admin:pass@192.168.1.64:554/Streaming/Channels/101
# 可选: 绑定源 IP (同 [rtsp] bind_ip)。
bind_ip =
# 环形缓冲大小 (MB)。4Mbps 主码流 ≈ 0.5MB/s。
# 185MB 内存板 (实测 RSS ~65MB + 系统 ~50MB) 建议 40~48, 配
# max_clip_seconds=60 (窗口 5+60=65s, 48MB ≈ 87s 覆盖)。
# 256MB 板可以 64。缩小时注意 min_available_memory_mb 余量。
ring_mb = 48
# 音频: true 时额外协商音频轨 (PCMU/PCMA/AAC), 切片带音轨一起上传。
# 摄像头无音频/不支持时自动降级为纯视频。内存开销约 audio_ring_mb MB。
# 仅 rtsp 模式生效; pipe 模式用 audio_pipe_path 键。
audio_enabled = true
audio_ring_mb = 1
# 保存策略: 只切 confirmed, 或连 probable 一起切 (默认只 confirmed)。
upload_probable = false

[upload]
# NAS ingest 端点 (HTTP POST multipart)。留空 = 不上传。
url = http://192.168.1.10:8000/api/ingest
# 事件窗口前后文 (秒); 总长超 max_clip_seconds 时压缩后窗。
# 切片窗口 (Q1 峰值居中): 以活动峰值时刻为中心, 前 context_before 后
# context_after; 超长会话不再丢弃而是钳制出 <=max_clip_seconds 的窗口。
context_before_seconds = 20
context_after_seconds = 40
# 尾部裁剪: 片段末端收到 last_active_ts + 该秒数, 去掉人走后的静默。
tail_trim_seconds = 2.0
# 185MB 板建议 60 (60s 家庭片段足够, 同时缩小内存占用与上传体积)。
max_clip_seconds = 60
min_clip_seconds = 3
# 窗口内相邻 NAL 间隔超过该值视为断流, 放弃切片。
gap_limit_seconds = 2.5
# 上传冷却: probable 事件距上次成功切片不足该秒数时跳过 (防轨迹抖动
# 重复上传); confirmed 不受冷却限制, 确认证据永不丢弃。
min_interval_seconds = 90
# 上传失败重试 (有界内存队列; 超限丢最旧)。
max_retries = 3
retry_delay_seconds = 5
upload_timeout_seconds = 30
# 上传待发队列上限 (个): 每个待发 clip 占用 ~30MB (60s 4K)。
# 185MB 板务必保持 <=2, 否则积压时内存翻倍导致 OOM。
max_queue = 2

[schedule]
# 板端仅在本地时间窗口内连接 RTSP 和运行识别。窗口外保留 MQTT 心跳。
enabled = true
start = 07:00
end = 21:00
# 板端系统通常显示 UTC；使用固定分钟偏移计算本地时间，避免依赖 tzdata。
utc_offset_minutes = 480

[model]
# 人脸检测模型 (.rknn): 直接复用现有 ultraface_320.rknn
detector = /root/daughter_watch/models/face_detector.rknn
# 人脸识别模型 (.rknn): MobileFaceNet, 输出 512 维特征
recognizer = /root/daughter_watch/models/mobilefacenet.rknn
# 女儿底库 (用 enroll 生成)
facedb = /root/daughter_watch/models/daughter.db
# Luckfox SDK 的 RV1106 PFP 人体/人脸检测模型目录。
rockiva_dir = /root/daughter_watch/models/rockiva

[pipeline]
# fusion: RockIVA 人体跟踪 + 按需人脸确认；face_only: 保留旧逻辑。
mode = fusion
person_scan_fps = 1.0
face_check_interval_seconds = 1.0
# threshold 需要在该窗口秒内命中两次才 confirmed；婴儿小脸场景建议 6 秒。
face_hit_window_seconds = 20.0
# 每次扫描最多处理的识别 ROI 数 (限制 NPU 占用)。
max_face_rois_per_scan = 4
# 调试: 1 时把 iva 任务检测器输入裁块落盘到 /tmp/roi_*.ppm (每 5 秒最多一张)。
debug_dump_crops = 0
# RockIVA 人脸框/头部区域外扩比例, 给识别留出上下文; 小脸场景适调大。
face_roi_margin = 0.70
# 无 RockIVA 人脸时, 儿童轨迹取人体框顶部该比例作为头部识别区。
head_roi_ratio = 0.55
probable_min_seconds = 6.0
probable_min_observations = 4
# 无脸儿童通道的活动量门槛: child_like 轨迹无露脸证据时, 活动量达该值
# 即升 probable (走路/玩耍中儿童活动量 ~0.2+, 坐着的成人 ~0.05)。
# 0.0 = 关闭活动量要求 (无脸即可 probable, 会引入成人误报)。
probable_min_activity = 0.20
# 成人先验否决: 同一轨迹连续 >= 该次数观测到身高超过
# child_max_height_ratio (站立/行走), 则粘滞判定为成人, 此后不得再经
# 无脸几何通道升级 probable。"走入画面后坐下"的成人会在身高跌破阈值
# 而活动量尚未衰减的瞬间达标锁存 (8/24 误报根因)。仅 >= high_threshold
# 的强人脸确认不受影响。0 = 禁用否决。
adult_tall_observations = 3
child_max_height_ratio = 0.40
relative_child_height_ratio = 0.65
confirmed_ttl_seconds = 8.0
# keyframes_only 抽样后有效帧率 ~1fps; 保留 8s 容忍检测偶发漏帧。
track_lost_seconds = 8.0
# child_like 尺寸判断短暂抖动时保持同一 probable session；重叠歧义不使用该宽限。
probable_hold_seconds = 3.0
# 低阈值命中积累确认只允许儿童轨迹 (更早的 child_like 判定的宽限秒数)。
# 成年人轨迹只有 >= high_threshold 的强相似度才能确认, 防止保存纯大人画面。
confirm_child_hold_seconds = 60.0
mqtt_update_seconds = 15.0

[rockiva]
# RockIVA 使用 1~100 分数。
person_score = 45
face_score = 45

[recognize]
# 余弦相似度阈值; 达到即判定为女儿。婴儿场景建议偏低(宁多存)
# 实测标定(2026-08-12 板端 crop 路径): 底库大脸互比 0.43-0.58,
# 640x360 实时小脸(19-41px)女儿本人仅 0.19-0.25 —— 0.35 会漏掉。
# 0.25 + "每轨迹最大脸"识别后应能覆盖, 再按成人负样本继续标定。
threshold = 0.25
# 一次达到该阈值即可确认；否则 threshold 需要在窗口内两次命中。
# 小脸场景几乎不可能一次顶到高分, 保留 0.55 作为远距离强证据。
high_threshold = 0.55
# 检测框最小边长(原图像素), 过滤太小/太远的脸; 640x360 子码流里幼儿脸
# 通常只有 16-24px, 24 会漏掉大部分小脸导致永远无法确认。
min_face = 14
# 人脸检测分数阈值 (RetinaFace 概率); ROI 裁剪路径可适当放宽。
det_score = 0.50
roi_det_score = 0.40

[mqtt]
host = 192.168.1.10
port = 1883
username =
password =
topic = homecam/daughter/hit
status_topic = homecam/daughter/status
client_id = rv1106-living_room
qos = 1
# 命中去抖: 同一事件在该秒数内只推一条
debounce_seconds = 10

[guard]
max_cpu_percent = 65
min_available_memory_mb = 80
max_temperature_c = 75
max_detector_p95_ms = 150

[meta]
camera_id = living_room
